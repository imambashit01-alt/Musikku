services:
  musikku:
    build: .
    container_name: musikku
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATA_DIRECTORY: /data
      DATABASE_PATH: /data/musikku.sqlite
      CLIENT_ORIGIN: http://localhost:3001
    ports:
      - "3001:3001"
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
